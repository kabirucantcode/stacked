# Render blueprint for stacked.
#
# Deploys a Postgres instance plus the Next.js app. Both use the free tier so
# you can try it end to end; upgrade `plan` when you need to stay awake.
#
# Notes:
#   - The build runs `prisma db push` so the very first deploy creates the
#     schema without you needing a local database. Once you are ready for real
#     migrations, commit `prisma/migrations` (npm run db:migrate) and swap that
#     step for `npx prisma migrate deploy`.
#   - `npm install` is used rather than `npm ci` because no package-lock.json is
#     committed yet. Once it is, prefer `npm ci` for reproducible builds.
#   - AUTH_SECRET is generated by Render; never commit it.

databases:
  - name: stacked-db
    databaseName: stacked
    user: stacked
    plan: free

services:
  - type: web
    name: stacked
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund && npx prisma db push && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stacked-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NODE_VERSION
        value: "22"
      # Optional. Leave unset and emails are logged to the server console
      # instead of sent. Fill these in the Render dashboard when you have a
      # Resend account.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Encrypts TOTP secrets at rest. Generated so it is never committed.
      - key: TOTP_ENCRYPTION_KEY
        generateValue: true
      # Demo trading moves the balance so the dashboard has live data.
      - key: DEMO_TRADING
        value: "true"
      # Watch-only receiving addresses, pre-generated in your custody wallet.
      - key: DEPOSIT_ADDRESSES
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: CRYPTO_USD_PRICES
        sync: false
      # Authorises /api/cron/*; generated by Render so it is never committed.
      - key: CRON_SECRET
        generateValue: true

# To credit deposits on a schedule, add a Render cron job (paid plans) that
# calls these with the secret above, e.g.:
#
#   curl -fsS -X POST https://<your-app>.onrender.com/api/cron/sync-deposits \
#     -H "Authorization: Bearer $CRON_SECRET"
#
# Repeat for /api/cron/demo-trades. Any scheduler works; it does not have to
# be Render.
